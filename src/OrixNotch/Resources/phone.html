<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>OrixNotch · {{NAME}}</title>
<style>
  :root { --bg:#0b0b0d; --card:#161619; --line:#2a2a2f; --text:#f5f5f7; --sub:#8a8a90; --accent:#ff8a3d; --good:#32d74b; --bad:#ff453a; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f4f6; --card:#fff; --line:#e3e3e8; --text:#141416; --sub:#6c6c72; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-size:22px; margin:4px 0 2px; }
  .sub { color:var(--sub); font-size:13px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-top:16px; }
  h2 { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--sub); margin:0 0 12px; }
  .drop { display:block; border:1.5px dashed var(--line); border-radius:12px; padding:22px 12px; text-align:center; cursor:pointer; }
  .drop b { color:var(--accent); }
  input[type=file] { display:none; }
  textarea { width:100%; min-height:72px; resize:vertical; background:transparent; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:10px; font:inherit; }
  button { background:var(--accent); color:#111; border:0; border-radius:10px; padding:10px 16px; font:600 14px system-ui,sans-serif; margin-top:8px; }
  ul { list-style:none; margin:0; padding:0; }
  li { display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line); }
  li:first-child { border-top:0; }
  .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .size { color:var(--sub); font-size:12px; white-space:nowrap; }
  a.get { color:var(--accent); text-decoration:none; font-weight:600; }
  .bar { height:4px; background:var(--line); border-radius:2px; overflow:hidden; margin-top:6px; }
  .bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .15s; }
  .ok { color:var(--good); } .err { color:var(--bad); }
  .empty { color:var(--sub); font-size:13px; }
  .head { display:flex; align-items:center; justify-content:space-between; margin:0 0 12px; }
  .head h2 { margin:0; }
  .all { margin:0; padding:6px 12px; font-size:13px; }
  .text { flex:1; min-width:0; white-space:pre-wrap; word-break:break-word; font-size:14px; max-height:9em; overflow:auto; }
  .copy { background:transparent; color:var(--accent); border:1px solid var(--line); margin:0; padding:6px 12px; font-size:13px; align-self:flex-start; }
  .badge { font-size:11px; color:var(--sub); border:1px solid var(--line); border-radius:6px; padding:1px 5px; margin-left:6px; }
  #toast { position:fixed; left:50%; top:12px; transform:translate(-50%,-80px); background:var(--accent); color:#111; font-weight:600;
           padding:10px 16px; border-radius:12px; transition:transform .25s; z-index:9; max-width:90vw; }
  #toast.show { transform:translate(-50%,0); }
</style>
</head>
<body>
<main>
  <h1>{{NAME}}</h1>
  <div class="sub">OrixNotch · same Wi-Fi only · this link stops working when Phone transfer is turned off</div>

  <section>
    <div class="head"><h2>From PC</h2><button id="all" class="all" hidden>Download all (.zip)</button></div>
    <ul id="outbox"><li class="empty">Loading…</li></ul>
  </section>

  <section>
    <h2>Send to PC</h2>
    <label class="drop" for="pick"><b>Choose files</b><br><span class="sub">Photos, videos, documents — they land on the Shelf</span></label>
    <input id="pick" type="file" multiple>
    <ul id="up"></ul>
  </section>

  <section>
    <h2>Send text</h2>
    <textarea id="text" placeholder="Links, notes, codes…"></textarea>
    <button id="sendText">Send</button> <span id="textState" class="sub"></span>
  </section>

  <section>
    <h2>On the Shelf</h2>
    <ul id="files"><li class="empty">Loading…</li></ul>
  </section>
</main>
<div id="toast"></div>
<script>
  const key = new URLSearchParams(location.search).get('k') || '';
  const q = p => p + (p.includes('?') ? '&' : '?') + 'k=' + encodeURIComponent(key);
  const fmt = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(0) + ' KB'
    : n < 1073741824 ? (n / 1048576).toFixed(1) + ' MB' : (n / 1073741824).toFixed(2) + ' GB';
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  let known = null;
  function toast(text) {
    const t = document.getElementById('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove('show'), 3000);
  }

  // Plain HTTP on the LAN isn't a secure context, so navigator.clipboard is missing: copy via a selection.
  function copy(text, button) {
    const area = document.createElement('textarea');
    area.value = text; area.setAttribute('readonly', ''); area.style.position = 'fixed'; area.style.opacity = '0';
    document.body.append(area); area.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch {}
    area.remove();
    if (!ok && navigator.clipboard) navigator.clipboard.writeText(text).then(() => { button.textContent = 'Copied'; });
    button.textContent = ok ? 'Copied' : 'Select & copy';
    setTimeout(() => { button.textContent = 'Copy'; }, 1500);
  }

  async function loadOutbox() {
    const list = document.getElementById('outbox');
    try {
      const r = await fetch(q('/web/outbox'));
      if (!r.ok) throw new Error(r.status === 403 ? 'Link expired — scan the QR code again.' : 'Error ' + r.status);
      const items = await r.json();
      if (known) {
        const fresh = items.filter(i => !known.has(i.id));
        if (fresh.length) {
          toast(fresh.length === 1 ? 'New from PC: ' + fresh[0].name : fresh.length + ' new items from PC');
          if (navigator.vibrate) navigator.vibrate(80);
        }
      }
      known = new Set(items.map(i => i.id));
      list.replaceChildren();
      if (!items.length) list.append(el('li', 'empty', 'Nothing yet. Drop files on the Phone tab in OrixNotch to send them here.'));
      for (const i of items) {
        const li = el('li');
        if (i.kind === 'text') {
          li.append(el('div', 'text', i.text));
          const b = el('button', 'copy', 'Copy');
          b.addEventListener('click', () => copy(i.text, b));
          li.append(b);
        } else {
          const name = el('span', 'name', i.name);
          if (i.kind === 'folder') name.append(el('span', 'badge', 'folder'));
          li.append(name);
          if (i.kind === 'file') li.append(el('span', 'size', fmt(i.size)));
          const a = el('a', 'get', i.kind === 'folder' ? 'Download .zip' : 'Download');
          a.href = q('/web/send?id=' + i.id);
          a.setAttribute('download', i.kind === 'folder' ? i.name + '.zip' : i.name);
          li.append(a);
        }
        list.append(li);
      }
      document.getElementById('all').hidden = items.filter(i => i.kind !== 'text').length < 2;
    } catch (e) {
      list.replaceChildren(el('li', 'err', e.message));
    }
  }

  document.getElementById('all').addEventListener('click', () => { location.href = q('/web/send-all'); });

  async function loadFiles() {
    const list = document.getElementById('files');
    try {
      const r = await fetch(q('/web/files'));
      if (!r.ok) throw new Error(r.status === 403 ? 'Link expired — scan the QR code again.' : 'Error ' + r.status);
      const files = await r.json();
      list.replaceChildren();
      if (!files.length) list.append(el('li', 'empty', 'Nothing on the Shelf. Drop files on the notch to share them here.'));
      for (const f of files) {
        const li = el('li');
        li.append(el('span', 'name', f.name), el('span', 'size', fmt(f.size)));
        const a = el('a', 'get', 'Download');
        a.href = q('/web/file?id=' + f.id);
        a.setAttribute('download', f.name);
        li.append(a);
        list.append(li);
      }
    } catch (e) {
      list.replaceChildren(el('li', 'err', e.message));
    }
  }

  function upload(file) {
    return new Promise(resolve => {
      const li = el('li');
      const body = el('div'); body.style.flex = '1'; body.style.minWidth = '0';
      const name = el('div', 'name', file.name);
      const bar = el('div', 'bar'); const fill = el('i'); bar.append(fill);
      const state = el('span', 'size', fmt(file.size));
      body.append(name, bar); li.append(body, state);
      document.getElementById('up').prepend(li);

      const xhr = new XMLHttpRequest();
      xhr.open('POST', q('/web/upload?name=' + encodeURIComponent(file.name)));
      xhr.upload.onprogress = e => { if (e.lengthComputable) fill.style.width = (e.loaded / e.total * 100) + '%'; };
      xhr.onload = () => {
        const ok = xhr.status === 200;
        state.textContent = ok ? 'Sent' : xhr.status === 403 ? 'Link expired' : 'Failed';
        state.className = ok ? 'size ok' : 'size err';
        if (ok) fill.style.width = '100%';
        resolve();
      };
      xhr.onerror = () => { state.textContent = 'Failed'; state.className = 'size err'; resolve(); };
      xhr.send(file);
    });
  }

  document.getElementById('pick').addEventListener('change', async e => {
    const files = [...e.target.files];
    e.target.value = '';
    for (const f of files) await upload(f); // one at a time keeps a weak Wi-Fi link steady
    loadFiles();
  });

  document.getElementById('sendText').addEventListener('click', async () => {
    const box = document.getElementById('text');
    const state = document.getElementById('textState');
    if (!box.value.trim()) return;
    try {
      const r = await fetch(q('/web/text'), { method: 'POST', body: box.value, headers: { 'Content-Type': 'text/plain; charset=utf-8' } });
      state.textContent = r.ok ? 'Sent ✓' : 'Failed (' + r.status + ')';
      if (r.ok) box.value = '';
    } catch { state.textContent = 'Failed'; }
  });

  loadOutbox();
  loadFiles();
  // Live: the PC says when something changed; EventSource reconnects by itself. The poll is a fallback.
  if (window.EventSource) {
    const events = new EventSource(q('/web/events'));
    events.addEventListener('outbox', loadOutbox);
    events.addEventListener('shelf', loadFiles);
    events.addEventListener('open', () => { loadOutbox(); loadFiles(); }); // catch up after a reconnect
  }
  setInterval(() => { loadOutbox(); loadFiles(); }, 30000);
</script>
</body>
</html>
