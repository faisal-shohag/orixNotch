name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore OrixNotch.sln

      - name: Build (Release)
        run: dotnet build OrixNotch.sln -c Release --no-restore

      - name: Publish check (win-x64 single file)
        run: dotnet publish src/OrixNotch -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrixNotch-ci-build
          path: dist/
          retention-days: 7
