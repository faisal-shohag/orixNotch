# Every push to main and every pull request: build, then produce all three installers so a broken
# package (WiX / MSIX manifest / publish) is caught before release, not on release day.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: |
          dotnet restore OrixNotch.sln
          dotnet build OrixNotch.sln -c Release --no-restore

      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2

      - name: Package (exe, MSI, MSIX)
        shell: pwsh
        run: |
          ./packaging/Build-Exe.ps1
          ./packaging/Build-Msi.ps1
          ./packaging/Build-Msix.ps1

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: OrixNotch-${{ github.sha }}
          path: |
            publish/exe/OrixNotch.exe
            publish/OrixNotch.msi
            publish/OrixNotch.msix
          retention-days: 14
